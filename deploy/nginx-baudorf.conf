# Baudorf — Nginx Reverse Proxy → Kestrel (127.0.0.1:5000)
# __DOMAIN__ setup-server.sh tarafından gerçek domain ile değiştirilir.
# certbot --nginx çalıştırılınca 443/TLS bloğu otomatik eklenir.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Video/görsel yüklemeleri için (UploadValidation 80MB)
    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
